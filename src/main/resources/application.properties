server.port=${PORT:8080}

spring.datasource.url=${AURASYNC_DB_URL}
spring.datasource.username=${AURASYNC_DB_USERNAME:postgres}
spring.datasource.password=${AURASYNC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}

aurasync.elasticsearch.api-key=${ELASTICSEARCH_API_KEY:}