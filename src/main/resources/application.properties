# Puerto: Render establece PORT automáticamente.
# En local se utiliza 8080.
server.port=${PORT:8080}

# Base de datos Supabase.
spring.datasource.url=${AURASYNC_DB_URL}
spring.datasource.username=${AURASYNC_DB_USERNAME}
spring.datasource.password=${AURASYNC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Elasticsearch.
spring.elasticsearch.uris=${ELASTICSEARCH_URL}
aurasync.elasticsearch.api-key=${ELASTICSEARCH_API_KEY}